<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GraceLink | 외국인 관광객 병원 코디네이터 연결 서비스</title>
  <meta name="description" content="GraceLink는 한국을 방문한 외국인 관광객이 아플 때 병원 코디네이터와 연결될 수 있도록 돕는 의료 커뮤니케이션 중개 웹서비스입니다." />
  <meta name="theme-color" content="#2F80ED" />

  <style>
    :root {
      --primary-blue: #2f80ed;
      --primary-blue-dark: #1b5fc7;
      --primary-green: #19b98a;
      --primary-green-dark: #0e8d69;
      --deep-blue: #12365f;
      --navy: #172033;

      --text-main: #172033;
      --text-sub: #657184;
      --text-light: #8a94a6;

      --bg-main: #f6f9fc;
      --bg-soft-blue: #eaf4ff;
      --bg-soft-green: #e9fff7;
      --white: #ffffff;
      --line: #e5edf5;

      --danger: #ff5a5f;
      --danger-bg: #fff1f1;

      --shadow-xs: 0 4px 10px rgba(23, 32, 51, 0.04);
      --shadow-sm: 0 10px 30px rgba(23, 32, 51, 0.08);
      --shadow-md: 0 18px 48px rgba(23, 32, 51, 0.12);
      --shadow-lg: 0 30px 80px rgba(23, 32, 51, 0.16);

      --radius-md: 20px;
      --radius-lg: 28px;
      --radius-xl: 36px;

      --header-height: 72px;
      --max-width: 1160px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(47, 128, 237, 0.12), transparent 34%),
        radial-gradient(circle at 85% 18%, rgba(25, 185, 138, 0.13), transparent 30%),
        var(--bg-main);
      line-height: 1.6;
      letter-spacing: -0.025em;
      overflow-x: hidden;
    }

    body.no-scroll {
      overflow: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .page {
      width: 100%;
      overflow: hidden;
    }

    .container {
      width: min(100% - 40px, var(--max-width));
      margin: 0 auto;
    }

    section {
      scroll-margin-top: 96px;
    }

    .section {
      padding: 92px 0;
    }

    .section-header {
      max-width: 760px;
      margin-bottom: 34px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      margin-bottom: 16px;
      border: 1px solid rgba(47, 128, 237, 0.12);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--primary-blue-dark);
      font-size: 13px;
      font-weight: 850;
      box-shadow: var(--shadow-xs);
    }

    .eyebrow.green {
      border-color: rgba(25, 185, 138, 0.18);
      color: var(--primary-green-dark);
      background: rgba(233, 255, 247, 0.78);
    }

    .section-title {
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.12;
      letter-spacing: -0.06em;
      color: var(--navy);
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .section-desc {
      color: var(--text-sub);
      font-size: 17px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1000;
      width: 100%;
      height: var(--header-height);
      background: rgba(255, 255, 255, 0.76);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(229, 237, 245, 0.78);
      transition: box-shadow 0.25s ease, background 0.25s ease;
    }

    .header.scrolled {
      background: rgba(255, 255, 255, 0.94);
      box-shadow: 0 12px 34px rgba(23, 32, 51, 0.08);
    }

    .nav {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: max-content;
      font-weight: 950;
      letter-spacing: -0.05em;
      font-size: 23px;
      color: var(--deep-blue);
    }

    .logo-mark {
      width: 38px;
      height: 38px;
      display: inline-grid;
      place-items: center;
      border-radius: 14px;
      color: white;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      box-shadow: 0 12px 24px rgba(47, 128, 237, 0.24);
      font-size: 19px;
      font-weight: 950;
      letter-spacing: 0;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      gap: 4px;
      list-style: none;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      padding: 0 12px;
      border-radius: 999px;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 850;
      transition: color 0.2s ease, background 0.2s ease;
      white-space: nowrap;
    }

    .nav-link:hover,
    .nav-link.active {
      color: var(--primary-blue-dark);
      background: rgba(47, 128, 237, 0.09);
    }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 17px;
      border-radius: 999px;
      background: var(--navy);
      color: white;
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 12px 25px rgba(23, 32, 51, 0.17);
      white-space: nowrap;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .nav-cta:hover {
      transform: translateY(-2px);
      background: var(--primary-blue-dark);
      box-shadow: 0 16px 32px rgba(47, 128, 237, 0.24);
    }

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 15px;
      background: rgba(47, 128, 237, 0.09);
      color: var(--deep-blue);
      position: relative;
    }

    .menu-toggle span {
      position: absolute;
      left: 12px;
      width: 20px;
      height: 2px;
      border-radius: 99px;
      background: currentColor;
      transition: transform 0.24s ease, opacity 0.24s ease, top 0.24s ease;
    }

    .menu-toggle span:nth-child(1) { top: 15px; }
    .menu-toggle span:nth-child(2) { top: 21px; }
    .menu-toggle span:nth-child(3) { top: 27px; }

    .menu-toggle.open span:nth-child(1) {
      top: 21px;
      transform: rotate(45deg);
    }

    .menu-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.open span:nth-child(3) {
      top: 21px;
      transform: rotate(-45deg);
    }

    .mobile-panel {
      display: none;
    }

    .hero {
      position: relative;
      padding: calc(var(--header-height) + 64px) 0 82px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(340px, 0.98fr);
      align-items: center;
      gap: 44px;
    }

    .hero-copy {
      position: relative;
      z-index: 2;
    }

    .hero-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 9px 13px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(229, 237, 245, 0.92);
      box-shadow: var(--shadow-xs);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 850;
      white-space: nowrap;
    }

    .badge strong {
      color: var(--primary-green-dark);
    }

    .hero-title {
      max-width: 730px;
      color: var(--navy);
      font-size: clamp(42px, 8vw, 74px);
      line-height: 1.03;
      letter-spacing: -0.075em;
      margin-bottom: 22px;
      word-break: keep-all;
    }

    .gradient-text {
      color: transparent;
      background: linear-gradient(120deg, var(--primary-blue), var(--primary-green));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .hero-desc {
      max-width: 660px;
      color: var(--text-sub);
      font-size: clamp(17px, 2.6vw, 20px);
      line-height: 1.82;
      margin-bottom: 30px;
      word-break: keep-all;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 26px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 52px;
      padding: 0 22px;
      border-radius: 17px;
      font-size: 15px;
      font-weight: 900;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color 0.18s ease;
      user-select: none;
      white-space: nowrap;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      color: white;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      box-shadow: 0 18px 34px rgba(47, 128, 237, 0.26);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 42px rgba(47, 128, 237, 0.32);
    }

    .btn-secondary {
      color: var(--deep-blue);
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(229, 237, 245, 0.95);
      box-shadow: var(--shadow-xs);
    }

    .btn-secondary:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-sm);
      border-color: rgba(47, 128, 237, 0.18);
    }

    .btn-dark {
      color: white;
      background: var(--navy);
      box-shadow: 0 18px 34px rgba(23, 32, 51, 0.2);
    }

    .hero-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      max-width: 620px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(229, 237, 245, 0.9);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 700;
      box-shadow: var(--shadow-xs);
      word-break: keep-all;
    }

    .hero-note b {
      color: var(--danger);
    }

    .hero-visual {
      position: relative;
      min-height: 620px;
      display: grid;
      place-items: center;
    }

    .phone-shell {
      position: relative;
      width: min(100%, 390px);
      min-height: 560px;
      padding: 16px;
      border-radius: 44px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(234, 244, 255, 0.88));
      box-shadow: var(--shadow-lg);
      border: 1px solid rgba(255, 255, 255, 0.88);
      overflow: hidden;
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 38px;
      border: 1px solid rgba(47, 128, 237, 0.08);
      pointer-events: none;
    }

    .phone-screen {
      position: relative;
      z-index: 1;
      min-height: 528px;
      padding: 18px;
      border-radius: 32px;
      background:
        radial-gradient(circle at 10% 8%, rgba(47, 128, 237, 0.18), transparent 28%),
        linear-gradient(180deg, #ffffff, #f7fbff);
      overflow: hidden;
    }

    .screen-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .screen-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 950;
      color: var(--deep-blue);
      letter-spacing: -0.035em;
    }

    .screen-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border-radius: 999px;
      background: var(--bg-soft-green);
      color: var(--primary-green-dark);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .screen-hero-card {
      padding: 18px;
      border-radius: 26px;
      background: linear-gradient(135deg, rgba(47, 128, 237, 0.98), rgba(25, 185, 138, 0.94));
      color: white;
      box-shadow: 0 18px 35px rgba(47, 128, 237, 0.24);
      margin-bottom: 14px;
    }

    .screen-hero-card .mini-label {
      display: inline-flex;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.18);
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    .screen-hero-card h3 {
      font-size: 23px;
      line-height: 1.2;
      letter-spacing: -0.055em;
      margin-bottom: 9px;
      word-break: keep-all;
    }

    .screen-hero-card p {
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      line-height: 1.65;
      font-weight: 700;
      word-break: keep-all;
    }

    .match-card,
    .symptom-card,
    .clinic-card-mini {
      padding: 14px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(229, 237, 245, 0.96);
      box-shadow: var(--shadow-xs);
      margin-bottom: 12px;
    }

    .match-card {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--bg-soft-blue), var(--bg-soft-green));
      font-size: 23px;
    }

    .match-card h4 {
      font-size: 14px;
      margin-bottom: 3px;
      letter-spacing: -0.035em;
    }

    .match-card p {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 750;
    }

    .progress-line {
      position: relative;
      height: 8px;
      margin-top: 9px;
      border-radius: 999px;
      background: #edf4fb;
      overflow: hidden;
    }

    .progress-line span {
      position: absolute;
      inset: 0 auto 0 0;
      width: 76%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--primary-blue), var(--primary-green));
    }

    .symptom-card h4,
    .clinic-card-mini h4 {
      font-size: 14px;
      margin-bottom: 10px;
      letter-spacing: -0.035em;
    }

    .symptom-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .symptom-tags span {
      padding: 7px 9px;
      border-radius: 999px;
      background: var(--bg-soft-blue);
      color: var(--primary-blue-dark);
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .clinic-card-mini {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .clinic-card-mini p {
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 750;
    }

    .mini-arrow {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--navy);
      color: white;
      font-weight: 950;
    }

    .floating-card {
      position: absolute;
      z-index: 3;
      width: 172px;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow-md);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      animation: floatY 4.5s ease-in-out infinite;
    }

    .floating-card.one {
      top: 76px;
      left: -6px;
    }

    .floating-card.two {
      right: -8px;
      bottom: 116px;
      animation-delay: -1.5s;
    }

    .floating-card .float-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      margin-bottom: 8px;
      border-radius: 15px;
      background: var(--bg-soft-green);
      font-size: 19px;
    }

    .floating-card h4 {
      font-size: 13px;
      margin-bottom: 4px;
    }

    .floating-card p {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.45;
      font-weight: 750;
      word-break: keep-all;
    }

    @keyframes floatY {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .trust-strip {
      padding: 18px 0 38px;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    .trust-item {
      padding: 18px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(229, 237, 245, 0.9);
      box-shadow: var(--shadow-xs);
    }

    .trust-item strong {
      display: block;
      color: var(--navy);
      font-size: 22px;
      letter-spacing: -0.045em;
      margin-bottom: 2px;
    }

    .trust-item span {
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 850;
      word-break: keep-all;
    }

    .problem-section {
      padding: 34px 0 24px;
    }

    .problem-card {
      display: grid;
      grid-template-columns: 0.85fr 1.15fr;
      gap: 34px;
      align-items: center;
      padding: 34px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(18, 54, 95, 0.96), rgba(27, 95, 199, 0.92));
      color: white;
      box-shadow: var(--shadow-md);
      overflow: hidden;
      position: relative;
    }

    .problem-card::after {
      content: "";
      position: absolute;
      right: -80px;
      bottom: -110px;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      background: rgba(25, 185, 138, 0.2);
    }

    .problem-card h2 {
      position: relative;
      z-index: 1;
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.16;
      letter-spacing: -0.06em;
      word-break: keep-all;
    }

    .problem-list {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
    }

    .problem-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.13);
    }

    .problem-item span {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.16);
      font-weight: 950;
    }

    .problem-item p {
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      font-weight: 700;
      word-break: keep-all;
    }

    .features-grid,
    .steps-wrap {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .feature-card,
    .step-card,
    .clinic-card,
    .price-card,
    .faq-note,
    .form-card,
    .coordinator-card,
    .request-side,
    .contact-card {
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(229, 237, 245, 0.96);
      box-shadow: var(--shadow-sm);
    }

    .feature-card {
      position: relative;
      min-height: 260px;
      padding: 24px;
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: transform 0.24s ease, box-shadow 0.24s ease;
    }

    .feature-card:hover,
    .clinic-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-md);
    }

    .feature-card::before {
      content: "";
      position: absolute;
      inset: auto -40px -54px auto;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(47, 128, 237, 0.08);
    }

    .feature-card:nth-child(even)::before {
      background: rgba(25, 185, 138, 0.11);
    }

    .feature-icon,
    .clinic-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--bg-soft-blue), var(--bg-soft-green));
      font-size: 26px;
    }

    .feature-card h3,
    .step-card h3,
    .clinic-card h3 {
      font-size: 21px;
      line-height: 1.24;
      letter-spacing: -0.045em;
      margin-bottom: 10px;
      color: var(--navy);
      word-break: keep-all;
    }

    .feature-card p,
    .step-card p,
    .clinic-card p {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 700;
      word-break: keep-all;
    }

    .step-card {
      position: relative;
      padding: 24px;
      min-height: 260px;
      border-radius: var(--radius-lg);
    }

    .step-number {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      margin-bottom: 20px;
      color: white;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      font-weight: 950;
      box-shadow: 0 12px 24px rgba(47, 128, 237, 0.2);
    }

    .request-layout {
      display: grid;
      grid-template-columns: 0.82fr 1.18fr;
      align-items: start;
      gap: 26px;
    }

    .request-side {
      position: sticky;
      top: 96px;
      padding: 30px;
      border-radius: var(--radius-xl);
      color: white;
      background: linear-gradient(150deg, var(--deep-blue), var(--primary-blue-dark) 52%, var(--primary-green-dark));
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }

    .request-side::after {
      content: "";

      right: -90px;
      top: -70px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
    }

    .request-side h2 {
      position: relative;
      z-index: 1;
      font-size: 34px;
      line-height: 1.16;
      letter-spacing: -0.06em;
      margin-bottom: 14px;
      word-break: keep-all;
    }

    .request-side p {
      position: relative;
      z-index: 1;
      color: rgba(255, 255, 255, 0.84);
      font-size: 15px;
      line-height: 1.78;
      font-weight: 700;
      margin-bottom: 24px;
      word-break: keep-all;
    }

    .side-checklist {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 10px;
      margin-top: 22px;
    }

    .side-checklist li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      list-style: none;
      padding: 12px;
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.92);
      font-size: 14px;
      font-weight: 800;
      word-break: keep-all;
    }

    .side-checklist li::before {
      content: "✓";
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      font-size: 12px;
      font-weight: 950;
    }

    .emergency-callout {
      position: relative;
      z-index: 1;
      padding: 16px;
      margin-top: 24px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    .emergency-callout strong {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }

    .emergency-callout span {
      color: rgba(255, 255, 255, 0.84);
      font-size: 13px;
      font-weight: 700;
      word-break: keep-all;
    }

    .form-card {
      padding: 26px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .field {
      display: grid;
      gap: 8px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      color: var(--navy);
      font-size: 13px;
      font-weight: 900;
    }

    .required {
      color: var(--danger);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      min-height: 52px;
      padding: 0 15px;
      border: 1px solid #dfe8f2;
      border-radius: 17px;
      outline: none;
      background: #fbfdff;
      color: var(--text-main);
      font-size: 15px;
      font-weight: 700;
      transition: border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .field textarea {
      min-height: 130px;
      resize: vertical;
      padding-top: 14px;
      line-height: 1.65;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: rgba(47, 128, 237, 0.72);
      background: white;
      box-shadow: 0 0 0 4px rgba(47, 128, 237, 0.11);
    }

    .input-help {
      color: var(--text-light);
      font-size: 12px;
      font-weight: 750;
      word-break: keep-all;
    }

    .emergency-box {
      display: none;
      grid-column: 1 / -1;
      padding: 16px;
      border-radius: 20px;
      background: var(--danger-bg);
      border: 1px solid rgba(255, 90, 95, 0.22);
      color: #9f1d22;
    }

    .emergency-box.show {
      display: block;
      animation: fadeIn 0.22s ease;
    }

    .emergency-box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 15px;
    }

    .emergency-box p {
      color: #9f1d22;
      font-size: 13px;
      line-height: 1.65;
      font-weight: 750;
      word-break: keep-all;
    }

    .consent-box {
      grid-column: 1 / -1;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 16px;
      border-radius: 20px;
      background: #f8fbff;
      border: 1px solid rgba(229, 237, 245, 0.95);
    }

    .consent-box input {
      width: 18px;
      height: 18px;
      margin-top: 3px;
      accent-color: var(--primary-blue);
      flex: 0 0 auto;
    }

    .consent-box label {
      color: var(--text-sub);
      font-size: 13px;
      line-height: 1.6;
      font-weight: 750;
      word-break: keep-all;
    }

    .form-actions {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
    }

    .form-actions .btn {
      flex: 1 1 240px;
    }

    .safe-note {
      grid-column: 1 / -1;
      color: var(--text-light);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.6;
      word-break: keep-all;
    }

    .clinics-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .clinic-card {
      padding: 22px;
      border-radius: var(--radius-lg);
      transition: transform 0.24s ease, box-shadow 0.24s ease;
    }

    .clinic-card p {
      margin-bottom: 14px;
    }

    .clinic-meta {
      display: inline-flex;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--bg-soft-blue);
      color: var(--primary-blue-dark);
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }

    .coordinator-section {
      padding: 92px 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.34), rgba(234, 244, 255, 0.58));
    }

    .coordinator-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 26px;
      align-items: center;
    }

    .coordinator-card {
      padding: 30px;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-md);
    }

    .coordinator-profile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 22px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--line);
    }

    .profile-avatar {
      width: 74px;
      height: 74px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 26px;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      color: white;
      font-size: 34px;
      box-shadow: 0 18px 32px rgba(47, 128, 237, 0.22);
    }

    .coordinator-profile h3 {
      font-size: 23px;
      letter-spacing: -0.045em;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .coordinator-profile p {
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 800;
      word-break: keep-all;
    }

    .role-list {
      display: grid;
      gap: 12px;
    }

    .role-item {
      display: flex;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: 19px;
      background: #f8fbff;
      border: 1px solid rgba(229, 237, 245, 0.9);
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 850;
      word-break: keep-all;
    }

    .role-item span {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--bg-soft-green);
      color: var(--primary-green-dark);
      font-weight: 950;
    }

    .conversation-demo {
      display: grid;
      gap: 12px;
    }

    .chat-bubble {
      width: fit-content;
      max-width: 88%;
      padding: 15px 17px;
      border-radius: 22px;
      color: var(--text-main);
      background: white;
      border: 1px solid rgba(229, 237, 245, 0.95);
      box-shadow: var(--shadow-xs);
      font-size: 15px;
      font-weight: 750;
      line-height: 1.62;
      word-break: keep-all;
    }

    .chat-bubble.user {
      justify-self: end;
      background: var(--primary-blue);
      color: white;
      border-color: var(--primary-blue);
      border-bottom-right-radius: 8px;
    }

    .chat-bubble.coordinator {
      justify-self: start;
      border-bottom-left-radius: 8px;
    }

    .chat-bubble.doctor {
      justify-self: start;
      background: var(--bg-soft-green);
      border-color: rgba(25, 185, 138, 0.16);
      border-bottom-left-radius: 8px;
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      align-items: stretch;
    }

    .price-card {
      position: relative;
      padding: 26px;
      border-radius: var(--radius-xl);
      overflow: hidden;
    }

    .price-card.featured {
      border-color: rgba(47, 128, 237, 0.28);
      box-shadow: var(--shadow-md);
      transform: translateY(-8px);
    }

    .popular-label {
      position: absolute;
      top: 18px;
      right: 18px;
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--bg-soft-green);
      color: var(--primary-green-dark);
      font-size: 12px;
      font-weight: 950;
    }

    .price-card h3 {
      font-size: 22px;
      letter-spacing: -0.045em;
      color: var(--navy);
      margin-bottom: 8px;
      padding-right: 78px;
      word-break: keep-all;
    }

    .price-desc {
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 700;
      line-height: 1.7;
      min-height: 48px;
      margin-bottom: 22px;
      word-break: keep-all;
    }

    .price {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      margin-bottom: 22px;
    }

    .price strong {
      font-size: 42px;
      line-height: 1;
      letter-spacing: -0.06em;
      color: var(--navy);
    }

    .price span {
      color: var(--text-light);
      font-size: 14px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .price-list {
      display: grid;
      gap: 11px;
      margin-bottom: 24px;
    }

    .price-list li {
      display: flex;
      gap: 10px;
      list-style: none;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.48;
      word-break: keep-all;
    }

    .price-list li::before {
      content: "✓";
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 999px;
      background: var(--bg-soft-blue);
      color: var(--primary-blue-dark);
      font-size: 12px;
      font-weight: 950;
    }

    .faq-layout {
      display: grid;
      grid-template-columns: 0.78fr 1.22fr;
      gap: 30px;
      align-items: start;
    }

    .faq-note {
      padding: 26px;
      border-radius: var(--radius-xl);
    }

    .faq-note h3 {
      color: var(--navy);
      font-size: 24px;
      letter-spacing: -0.045em;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .faq-note p {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 700;
      word-break: keep-all;
    }

    .faq-list {
      display: grid;
      gap: 12px;
    }

    .faq-item {
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(229, 237, 245, 0.95);
      box-shadow: var(--shadow-xs);
      overflow: hidden;
    }

    .faq-question {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 68px;
      padding: 0 20px;
      background: transparent;
      color: var(--navy);
      text-align: left;
      font-size: 16px;
      font-weight: 900;
      word-break: keep-all;
    }

    .faq-question .plus {
      width: 32px;
      height: 32px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: var(--bg-soft-blue);
      color: var(--primary-blue-dark);
      transition: transform 0.2s ease;
      font-weight: 950;
    }

    .faq-item.open .faq-question .plus {
      transform: rotate(45deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s ease;
    }

    .faq-answer-inner {
      padding: 0 20px 20px;
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 700;
      word-break: keep-all;
    }

    .contact-card {
      padding: 34px;
      border-radius: var(--radius-xl);
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.92), rgba(234, 244, 255, 0.86));
      box-shadow: var(--shadow-md);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 24px;
    }

    .contact-card h2 {
      color: var(--navy);
      font-size: clamp(28px, 5vw, 44px);
      line-height: 1.16;
      letter-spacing: -0.06em;
      margin-bottom: 12px;
      word-break: keep-all;
    }

    .contact-card p {
      max-width: 720px;
      color: var(--text-sub);
      font-size: 16px;
      line-height: 1.78;
      font-weight: 700;
      word-break: keep-all;
    }

    .footer {
      padding: 54px 0 34px;
      background: #0f1d31;
      color: white;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr 0.9fr;
      gap: 26px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.11);
    }

    .footer-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 24px;
      font-weight: 950;
      letter-spacing: -0.045em;
      margin-bottom: 14px;
    }

    .footer p {
      color: rgba(255, 255, 255, 0.68);
      font-size: 14px;
      line-height: 1.75;
      font-weight: 700;
      word-break: keep-all;
    }

    .footer h3 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .footer-links {
      display: grid;
      gap: 9px;
    }

    .footer-links a {
      color: rgba(255, 255, 255, 0.68);
      font-size: 14px;
      font-weight: 800;
      transition: color 0.18s ease;
    }

    .footer-links a:hover {
      color: white;
    }

    .footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 24px;
      color: rgba(255, 255, 255, 0.56);
      font-size: 13px;
      font-weight: 700;
      word-break: keep-all;
    }

    .floating-help {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 950;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 54px;
      padding: 0 18px;
      border-radius: 999px;
      color: white;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      box-shadow: 0 18px 42px rgba(47, 128, 237, 0.32);
      font-size: 14px;
      font-weight: 950;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .floating-help:hover {
      transform: translateY(-3px);
      box-shadow: 0 22px 52px rgba(47, 128, 237, 0.38);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 22px;
      background: rgba(15, 29, 49, 0.54);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .modal-backdrop.show {
      display: flex;
      animation: fadeIn 0.2s ease;
    }

    .modal {
      width: min(100%, 460px);
      padding: 28px;
      border-radius: 32px;
      background: white;
      box-shadow: var(--shadow-lg);
      animation: modalUp 0.24s ease;
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
      border-radius: 24px;
      background: var(--bg-soft-green);
      color: var(--primary-green-dark);
      font-size: 30px;
      font-weight: 950;
    }

    .modal h2 {
      color: var(--navy);
      font-size: 28px;
      line-height: 1.18;
      letter-spacing: -0.055em;
      margin-bottom: 10px;
      word-break: keep-all;
    }

    .modal p {
      color: var(--text-sub);
      font-size: 15px;
      line-height: 1.75;
      font-weight: 700;
      margin-bottom: 18px;
      word-break: keep-all;
    }

    .request-number {
      padding: 14px;
      border-radius: 18px;
      background: #f8fbff;
      border: 1px solid rgba(229, 237, 245, 0.95);
      color: var(--text-sub);
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .request-number strong {
      color: var(--primary-blue-dark);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 94px;
      z-index: 2100;
      display: none;
      transform: translateX(-50%);
      max-width: calc(100% - 40px);
      padding: 13px 16px;
      border-radius: 999px;
      color: white;
      background: rgba(15, 29, 49, 0.92);
      box-shadow: var(--shadow-md);
      font-size: 13px;
      font-weight: 850;
      text-align: center;
      word-break: keep-all;
    }

    .toast.show {
      display: block;
      animation: toastUp 2.2s ease forwards;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.58s ease, transform 0.58s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes fadeIn {
      from { opacity: 0; }
